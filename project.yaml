# Configuração inicial do jogo.
# Preferências de rigor não definidas; seguem a resolução do workspace de desenvolvimento.

schema_version: 1

platform:
  # O alvo da plataforma Mobile nesta fatia é Android.
  targets: ["Mobile"]
  primary_input: "Touch"
  gamepad_support: "None"
  touch_support: "Full"

engine:
  name: "Unity"
  version: "6000.6.9f1"
  language: "C#"
  rendering: "URP"
  physics: "Unity 2D Physics"

commands:
  build: "[Build Profile Android ativo; comando do primeiro build ainda não validado]"
  test: "[NUnit EditMode; 22 testes aprovados na execução manual do usuário]"
  run: "[Abrir o projeto Macacos Me Mordam pelo Unity Hub]"
  smoke: "[A configurar após validar a compilação no Editor]"

testing:
  framework: "nunit"
